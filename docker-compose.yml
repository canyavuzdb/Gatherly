services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatherly}
      POSTGRES_USER: ${POSTGRES_USER:-gatherly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatherly_local_password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://gatherly:gatherly_local_password@postgres:5432/gatherly}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deployment}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      ["node", "apps/api/node_modules/typeorm/cli.js", "migration:run", "-d", "apps/api/dist/database/data-source.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gatherly:gatherly_local_password@postgres:5432/gatherly}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["tools"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
